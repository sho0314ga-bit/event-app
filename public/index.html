<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Event App</title>

  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: sans-serif;
    }

    input,
    button {
      margin: 5px;
      padding: 8px;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
    }

   .event-card {
     border: 1px solid #ccc;
     border-radius: 8px;
     padding: 15px;
     margin: 15px 0;
    }

    input {
     border: 1px solid #ccc;
     border-radius: 6px;
    }

    button {
     border: none;
     border-radius: 6px;
     background: #333;
     color: white;
    }

    button:hover {
     opacity: 0.8;
    }

    input {
     box-sizing: border-box;
     max-width: 100%;
    }

    @media (max-width: 600px) {
     input,
     button {
       width: 100%;
       margin: 5px 0;
      } 
    }
  </style>
</head>

<body>

<h1>イベント管理アプリa版</h1>

<!-- イベント追加 -->
<h2>イベントを追加</h2>

<div>
  <input id="eventInput" type="text" placeholder="イベント名">
  <input id="venueInput" type="text" placeholder="会場">
  <input id="dateInput" type="date">
  <input id="lotteryDateInput" type="date">

  <button onclick="addEvent()">イベントを追加</button>
</div>

<hr>

<!-- 検索 -->
<h2>イベントを検索</h2>

<div>
  <input
    id="searchInput"
    type="text"
    placeholder="イベントを検索"
    oninput="searchEvents()"
  >

  <button onclick="searchEvents()">検索</button>
</div>

<hr>

<!-- 表示切り替え -->
<h2>表示を切り替える</h2>

<div>
  <button id="favoriteButton" onclick="toggleFavoriteView()">
    お気に入りだけ表示
  </button>

  <button id="sortEventsButton" onclick="sortEvents()">
    開催日順
  </button>
</div>

<br>

<div>
 


  <button onclick="showTodayEvents()">
    本日開催のイベント
  </button>

  <button onclick="showTomorrowEvents()">
    明日開催のイベント
  </button>

  <button onclick="showWithinThreeDays()">
    3日以内のイベント
  </button>

   <button onclick="showUpcomingEvents()">
    お気に入りの開催予定イベント
  </button>

  <button onclick="showPastEvents()">
    過去のイベント
  </button>
</div>

<hr>

<!-- イベント一覧 -->
<h2>イベント一覧</h2>

<div id="result"></div>

<script>







function showTomorrowEvents(){
  const today = getToday();

  fetch("/events")
  .then(response => response.json())
  .then(data => {
    const tomorrowEvents = data.filter(event=>{
      return isTomorrowEvent(event,today)
    });
    if(tomorrowEvents.length === 0){
     document.getElementById("result").innerHTML = 
     "<p>明日開催のイベントはありません</p>";
     return;
    }
    renderEvents(tomorrowEvents);
  });  
}



function showUpcomingEvents(){
 const today = getToday();
 
 fetch("/events")
 .then(response => response.json())
 .then(data => {
   const upcomingEvents = data.filter(event => {
     return (!isPastEvent(event,today) &&
       event.favorite === 1
      )
   });
   if(upcomingEvents.length === 0){
     document.getElementById("result").innerHTML = 
     "<p> お気に入りの開催予定のイベントはありません </p>"
     return;
    }
   renderEvents(upcomingEvents);
  });
}



 function showWithinThreeDays(){
  const today = getToday();

  fetch ("/events")
  .then(response => response.json())
  .then(data => {
   const WithinThreeDaysEvents = data.filter(event => {
     return isWithinThreeDays(event,today);
    });
   if(WithinThreeDaysEvents.length === 0){
     document.getElementById("result").innerHTML =
     "<p>3日以内のイベントはありません</p>";
     return;
    }
    renderEvents(WithinThreeDaysEvents);
  });
}



function showPastEvents(){
 const today = getToday();
 fetch("/events")
 .then(response => response.json())
 .then(data =>{
   const pastEvents = data.filter(event => {
   return isPastEvent(event,today);
   });
   if (pastEvents.length === 0) {
      document.getElementById("result").innerHTML =
        "<p>過去のイベントはありません</p>";
      return;
    }
   renderEvents(pastEvents);
  });
}



function showTodayEvents(){
 const today = getToday();
 
 fetch("/events")
 .then(response => response.json())
 .then(data =>{
   const todayEvents = data.filter(event =>{
     return isTodayEvent(event,today);
    });
    if (todayEvents.length === 0) {
     document.getElementById("result").innerHTML =
     "<p>本日のイベントはありません</p>";
      return;
    }
    renderEvents(todayEvents);
  });
}



function isPastEvent(event,today){
const eventDate = new Date(event.date);
eventDate.setHours(0,0,0,0);
return eventDate<today;
}

function getToday(){
  const today = new Date();
  today.setHours(0,0,0,0);
  return today;
}

function isTodayEvent(event,today){
  const eventDate = new Date(event.date);
  eventDate.setHours(0,0,0,0);
  return eventDate.getTime() === today.getTime();
}

function isTomorrowEvent(event,today){
  const eventDate = new Date(event.date);
  eventDate.setHours(0,0,0,0);
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate()+1);
  return eventDate.getTime() === tomorrow.getTime() ;
}

function isWithinThreeDays(event,today){
 const eventDate = new Date(event.date);
 eventDate.setHours(0,0,0,0);
 const ThreeDays = new Date(today);
 ThreeDays.setDate(ThreeDays.getDate()+3);
 return eventDate.getTime() >= today.getTime()&&
        eventDate.getTime() <= ThreeDays.getTime(); 
}









loadEvents();



function loadEvents(){
 fetch("/events")
  .then(response => response.json())
  .then(data => {
   renderEvents(data);
  })
  .catch(error => {
    console.error(error);

    document.getElementById("result").innerHTML=
    "<p>データの取得に失敗しました</p>";
  });
}



function renderEvents(data){
  const result = document.getElementById("result");
  result.innerHTML = "";

  for(let i = 0;i<data.length;i++){
    const event = data[i];

    const card = document.createElement("div")
    card.className = "event-card";

    const title = document.createElement("h3");
    title.textContent = event.name;
    card.appendChild(title);
  
    const venue = document.createElement("p");
    venue.textContent = "会場："+event.venue;
    card.appendChild(venue);
    
    const date = document.createElement("p");
    date.textContent = "開催日：" + event.date;
    card.appendChild(date);

    const lotteryDate = document.createElement("p");
    lotteryDate.textContent = "当落日：" + event.lotteryDate;
    card.appendChild(lotteryDate);
    
    const toggleFavoriteButton = document.createElement("button");
   toggleFavoriteButton.textContent = (event.favorite ? "★お気に入り済み" : "☆お気に入り");
   toggleFavoriteButton.onclick = function(){
     toggleFavoriteFromDB(event.id);
    };
   card.appendChild(toggleFavoriteButton);

    const editButton = document.createElement("button");
    editButton.textContent = "編集";
    editButton.onclick = function() {
     editEventFromDB(event.id);
    };
    card.appendChild(editButton);

   const deleteButton = document.createElement("button");
   deleteButton.textContent = "削除";
   deleteButton.onclick = function(){
     deleteEventFromDB(event.id);
    };
   card.appendChild(deleteButton);

    result.appendChild(card);
  }
}  
  
  
 


function addEvent(){

   const event =  document.getElementById("eventInput").value;
   const venue = document.getElementById("venueInput").value;
   const date = document.getElementById("dateInput").value;
   const lotteryDate = document.getElementById("lotteryDateInput").value;

 if(event.trim() === ""|| venue.trim() === ""|| date.trim() === ""){
  alert("イベント名・会場名・開催日を入力してください");
  return;
 }
  
 const newEvent = {
    name: event.trim(),
    venue: venue.trim(),
    date: date.trim(),
    lotteryDate: lotteryDate.trim(),
    favorite: 0
  };

 let requestOK;

  fetch("/events",{
   method: "POST",
   headers:{
     "Content-Type":"application/json"
    },
   body:JSON.stringify(newEvent)
  })

 .then (response =>{
   requestOK = response.ok;
   return response.json();
  })
 .then(data =>{
   if(!requestOK){
     alert(data.error);
     return;
    }

   loadEvents();
  });
}



function deleteEventFromDB(id){
  fetch("/events/"+id,{
    method:"DELETE"
  })
  .then (response => response.json())
  .then(data =>{
    loadEvents();
  })
}



function editEventFromDB(id) {

  fetch("/events")
  .then(response => response.json())
  .then(data => {

    for (let i = 0; i < data.length; i++) {

      if (data[i].id === id) {

        const event = data[i];

       const newName = prompt("イベント名を入力してください", event.name);
       if(newName === null){
         return;
        }
       if(newName.trim() === ""){
         alert("イベント名を入力してください");
         return;
        }

       const newVenue = prompt("会場を入力してください", event.venue);
       if(newVenue === null){
         return;
        }
       if(newVenue.trim() === ""){
         alert("会場を入力してください");
         return;
        }

       const newDate = prompt("開催日を入力してください", event.date);
       if(newDate === null){
         return;
        }
       if(newDate.trim() === ""){
         alert("開催日を入力してください");
         return;
        }

       const newLotteryDate = prompt("当落日を入力してください", event.lotteryDate);
       if(newLotteryDate === null){
         return;
        }

       const updatedEvent = {
         name: newName.trim(),
         venue: newVenue.trim(),
         date: newDate.trim(),
         lotteryDate: newLotteryDate.trim(),
         favorite: event.favorite
        };
        
        let requestOK;
        
        fetch("/events/" + id, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(updatedEvent)
        })
        .then(response => {
          requestOK = response.ok;
          return response.json()
        })
        .then(data => {
          if(!requestOK){
           alert(data.error);
           return;
          }

          loadEvents();
        });
      }
    }
  });
}



function toggleFavoriteFromDB(id){
 fetch("/events")
  .then(response => response.json())
  .then(data => {
    for(let i=0; i<data.length;i++){
      if(data[i].id === id){
       const event = data[i];
       const newFavorite = event.favorite === 0 ? 1:0
        
       const updatedEvent = {
         name:event.name,
         venue:event.venue,
         date:event.date,
         lotteryDate:event.lotteryDate,
         favorite:newFavorite
        };
       
       fetch("/events/"+id,{
         method:"PATCH",
         headers:{
           "content-Type" : "application/json"
          },
         body:JSON.stringify(updatedEvent)
        })
       .then(response => response.json())
       .then(data => {
         loadEvents();
        });
      }
    }
  });
}



function searchEvents() {
  const keyword = document.getElementById("searchInput").value;
  
 if (keyword === "") {
   loadEvents();
   return;
 }
  fetch("/events")
  .then(response => response.json())
  .then(data =>{
   const searchResults = data.filter(event => {
      return(
       event.name.includes(keyword) ||
       event.venue.includes(keyword) ||
       event.date.includes(keyword) ||
       event.lotteryDate.includes(keyword)
      ) 
    });
   if (searchResults.length === 0) {
     document.getElementById("result").innerHTML = "<p>該当するイベントはありません</p>";
     return;
    }
    renderEvents(searchResults); 
  });
}



function showFavorites() {
 fetch ("/events")
 .then(response => response.json())
 .then(data =>{ 
    const favoriteEvents = data.filter(event => {
      return event.favorite ===1;
    });
    renderEvents(favoriteEvents);
   document.getElementById("favoriteButton").textContent = "すべて表示";
  });
}



function toggleFavoriteView() {
  const button = document.getElementById("favoriteButton");

  if (button.textContent === "お気に入りだけ表示") {
    showFavorites();
  } else {
    loadEvents();
    button.textContent = "お気に入りだけ表示";
  }
}



function sortEvents(){
 fetch("/events")
 .then(response => response.json())
 .then(data =>{
   data.sort((a, b) => {
     return new Date(a.date) - new Date(b.date);
   })
   renderEvents(data);
  });
}



</script>
</body>
</html>
