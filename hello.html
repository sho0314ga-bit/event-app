<!DOCTYPE html>
<html>
<body>

<h1>イベントアプリa版</h1>



<button onclick="alert('押されました！')">押してみる</button>

<input id="eventInput" type="text" placeholder="イベント名">
<input id="venueInput" type="text" placeholder="会場">
<input id="dateInput" type="text" placeholder="開催日">
<input id="lotteryDateInput" placeholder="当落日">
<input id="searchInput" placeholder="イベントを検索" oninput="searchEvents()">
<button id="favoriteButton" onclick="toggleFavoriteView()">お気に入り</button>
<button onclick="searchEvents()">検索</button>
<button onclick="showEvent()">イベントを表示</button>
<button id="sortEventsButton" onclick="sortEvents()">開催日順</button>
<button onclick="showUpcomingEvents()">お気に入りの開催予定イベント</button>
<button onclick="showPastEvents()">過去のイベント</button>
<button onclick="showTodayEvents()">本日開催のイベント</button>
<button onclick="showTomorrowEvents()">明日開催のイベント</button>
<button onclick="showWithinThreeDays()">3日以内のイベント</button>
<p id="result"></p>

<script>


 let events = JSON.parse(localStorage.getItem("events")) || [];

function showEvent() {
  const event = document.getElementById("eventInput").value;
  const venue = document.getElementById("venueInput").value;
  const date = document.getElementById("dateInput").value;
  const lotteryDate = document.getElementById("lotteryDateInput").value;


  events.push({
    name: event,
    venue: venue,
    date: date,
    lotteryDate: lotteryDate,
    favorite: false

  });

  localStorage.setItem("events", JSON.stringify(events));

  displayEvents();
}

function searchEvents() {
  const keyword = document.getElementById("searchInput").value;
  
  if (keyword === "") {
  displayEvents();
  return;
}
  
  let html = "";
  let count = 0;

  for (let i = 0; i < events.length; i++) {
    const event = events[i];

  if (
  event.name.includes(keyword) ||
  event.venue.includes(keyword) ||
  event.date.includes(keyword) ||
  event.lotteryDate.includes(keyword)
) {
    html += "<h2>" + (count + 1) + ". " + event.name + "</h2>";
    html += "<p>会場：" + event.venue + "</p>";
    html += "<p>開催日：" + event.date + "</p>";
    html += "<p>当落日：" + event.lotteryDate + "</p>";
    html += "<button onclick=\"toggleFavorite(" + i + ")\">" +(event.favorite ? "★ お気に入り済み" : "☆ お気に入り") +"</button>";
    html += "<button onclick=\"editEvent(" + i + ")\">編集</button>";
    html += "<button onclick=\"deleteEvent(" + i + ")\">削除</button>";
    
    count++;
}
  }
 
 if (count === 0) {

 
  html = "<p>該当するイベントはありません</p>";
} else {
  html = "<p>検索結果：" + count + "件</p>" + html;
}

  console.log(html);
  document.getElementById("result").innerHTML = html;
}

function showFavorites() {
  let html = "";

  for (let i = 0; i < events.length; i++) {
    if (events[i].favorite === true) {
      html +=
        "<p>" +
        events[i].name + "<br>" +
        events[i].venue + "<br>" +
        events[i].date + "<br>" +
       "当落日：" + events[i].lotteryDate + "<br>" +
       "<button onclick=\"editEvent(" + i + ")\">編集</button>" +
       "<button onclick=\"deleteEvent(" + i + ")\">削除</button>" +
       "<button onclick=\"toggleFavorite(" + i + ")\">★ お気に入り済み</button>" +
       "</p>";
    }
  }

  document.getElementById("result").innerHTML = html;
  document.getElementById("favoriteButton").textContent = "すべて表示";
}

function toggleFavoriteView() {
  const button = document.getElementById("favoriteButton");

  if (button.textContent === "お気に入りだけ表示") {
    showFavorites();
  } else {
    displayEvents();
    button.textContent = "お気に入りだけ表示";
  }
}



function deleteEvent(index) {
 
  if (!confirm("本当に削除しますか？")) {
  return;
}

  events.splice(index, 1);
  localStorage.setItem("events", JSON.stringify(events));

  console.log("削除後のイベント数：" + events.length);

  searchEvents();


}

function toggleFavorite(index) {
  events[index].favorite = !events[index].favorite;

  localStorage.setItem("events", JSON.stringify(events));

  displayEvents();
}

function showUpcomingEvents(){

 let html = "";
 let count = 0;
 const today = getToday();

 for(let i = 0; i< events.length; i++){
 const event = events[i];

 if(!isPastEvent(event,today) &&
  event.favorite === true
 ){
  html+= "<p>"+ event.name +"</p>"+
  "<p>会場："+ event.venue +"</p>"+
  "<p>開催日："+ event.date +"</p>"+
  "<p> ★お気に入り </p>";

  count++;
 }
}
  if(count === 0){
    html = "<p> お気に入りの開催予定のイベントはありません </p>"
 } else {
 html = "<p>お気に入りの開催予定イベント："+ count +"件</p>" + html;
 }
 document.getElementById("result").innerHTML =html;

 }



function showPastEvents(){
  let html = ""
  let count = 0
  const today = getToday();

  for (let i = 0; i < events.length; i++){
   const event = events[i];

    if(isPastEvent(event,today)){
      html +="<p>"+ event.name +"</p>"+
             "<p>会場："+ event.venue +"</p>" +
             "<p>開催日："+ event.date +"</p>";

    count++;
    }
  }
  if(count === 0){
    html = "<p>過去のイベントはありません</p>";
  }else{
    html="<p>過去のイベント："+count+"件</p>" + html;
  }

document.getElementById("result").innerHTML=html;
}

function showTodayEvents(){
let html= "";
let count= 0;
const today = getToday();

for (let i = 0; i<events.length;i++){
  const event = events[i];

  if (isTodayEvent(event,today)){

    html += "<p>"+event.name+"</p>" +
    "<p>"+event.venue+"</p>"+
    "<p>"+event.date+"</p>";
    count++
  }
}
  if(count === 0){
    html = "<p>本日開催のイベントはありません</p>";
  }else{
    html = "<p>本日の開催イベント："+count+"件</p>"+html;
  }
document.getElementById("result").innerHTML=html;
}



function editEvent(index) {
console.log("editEventが実行されました");
  const event = events[index];

  const newName = prompt("イベント名を入力してください", event.name);
  const newVenue = prompt("会場を入力してください", event.venue);
  const newDate = prompt("開催日を入力してください", event.date);
  const newlotteryDate = prompt("当落日を入力してください", event.lotteryDate);
  

  if (newName !== null && newVenue !== null && newDate !== null && newlotteryDate !== null) {
    event.name  = newName
    event.venue = newVenue
    event.date  = newDate
    event.lotteryDate = newlotteryDate

    localStorage.setItem("events", JSON.stringify(events));

    displayEvents();
  }
}

 function sortEvents(){
   events.sort((a, b) => {
  return new Date(a.date) - new Date(b.date);
})

  displayEvents();
}


function displayEvents() {
  let html = "";

  for (let i = 0; i < events.length; i++) {
  const event = events[i];

  const eventDate = new Date(event.date);
  const today = new Date();

  eventDate.setHours(0,0,0,0);
  today.setHours(0,0,0,0);

  let status = "";

  if(eventDate<today){
    status = "開催済み";
  }else
  if(eventDate.getTime() === today.getTime()){
    status = "本日開催";
  }else{
    status = "開催予定";
  }
  
    html +=
  "<p>番号：" + i + "</p>" +
      "<h2>" + event.name + "</h2>" +
      "<p>会場：" + event.venue + "</p>" +
      "<p>開催日：" + event.date + "</p>" +
      "<p>" + status + "</p>" +
      "<p>当落日：" + event.lotteryDate + "</p>" +
      "<button onclick=\"toggleFavorite(" + i + ")\">" +(events[i].favorite ? "★ お気に入り済み" : "☆ お気に入り") +"</button>" +
      "<button onclick=\"editEvent(" + events.indexOf(event) + ")\">編集</button>" +
      "<button onclick=\"deleteEvent(" + events.indexOf(event) + ")\">削除</button>" +
      "<hr>";
  }

  document.getElementById("result").innerHTML = html;
}

function isPastEvent(event,today){
const eventDate = new Date(event.date);
eventDate.setHours(0,0,0,0);
return eventDate<today;
}

function getToday(){
  const today = new Date();
  today.setHours(0,0,0,0);
  return today;
}

function isTodayEvent(event,today){
  const eventDate = new Date(event.date);
  eventDate.setHours(0,0,0,0);
  return eventDate.getTime() === today.getTime();
}


function isTomorrowEvent(event,today){
  const eventDate = new Date(event.date);
  eventDate.setHours(0,0,0,0);
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate()+1);
  return eventDate.getTime() === tomorrow.getTime() ;
}

function showTomorrowEvents(){
  let html = "";
  let count = 0;
  const today = getToday();

  for(let i=0; i< events.length;i++){
    const event = events[i];

    if(isTomorrowEvent(event,today)){
    html += "<p>"+event.name+"</P>"+
    "<p>会場名："+event.venue+"</p>";
    count++;
    }
  }
if(count === 0){
  html = "<p>明日開催のイベントはありません</p>";
}else{
html = "<p>イベント数："+count+"件</p>"+html;
}
document.getElementById("result").innerHTML = html;
}

function isWithinThreeDays(event,today){
 const eventDate = new Date(event.date);
 eventDate.setHours(0,0,0,0);
 const ThreeDays = new Date(today);
 ThreeDays.setDate(ThreeDays.getDate()+3);
 return eventDate.getTime() >= today.getTime()&&
        eventDate.getTime() <= ThreeDays.getTime(); 
}

function showWithinThreeDays(){
  let html = "";
  let count = 0;
  const today = getToday();

  for(let i=0; i< events.length;i++){
    const event = events[i];

    if(isWithinThreeDays(event,today)){
    html += "<p>"+event.name+"</P>"+
    "<p>会場名："+event.venue+"</p>"+
    "<p>開催日："+event.date+"</p>";
    count++;
    }
  }
if(count === 0){
  html = "<p>3日以内のイベントはありません</p>";
}else{
html = "<p>イベント数："+count+"件</p>"+html;
}
document.getElementById("result").innerHTML = html;
}


displayEvents();

fetch("/events")
  .then(response => response.json())
  .then(data => {
    let html =  "";

    for(let i=0; i<data.length;i++){
    html += "<p>"+data[i].name+"</p>"+
    "<p>会場："+data[i].venue+"</p>";
    }
    document.getElementById("result").innerHTML = html;
  
  });





</script>
</body>
</html>
